<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Resume Analyzer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #f5f5f3; color: #1a1a1a; }
    .page { margin: 0 auto; padding: 2rem 1rem; }
    h1 { font-size: 22px; font-weight: 500; margin-bottom: 1.5rem; }
    .form-card { background: #fff; border: 0.5px solid #ddd; border-radius: 12px; padding: 1.5rem; margin: 1rem; margin-bottom: 1.5rem; width: 45%;}
    .field { margin-bottom: 1rem; }
    label { display: block; font-size: 13px; color: #666; margin-bottom: 4px; }
    input[type="text"], input[type="date"], textarea {
      width: 100%; padding: 8px 10px; border: 0.5px solid #ccc;
      border-radius: 8px; font-size: 14px; background: #fafafa;
    }
    input[type="file"] { font-size: 14px; }
    textarea { resize: vertical; }
    .topSection{
        display: flex;
    }
    .btn {
      padding: 8px 20px; font-size: 14px; font-weight: 500; cursor: pointer;
      border: 0.5px solid #ccc; border-radius: 8px; background: #fff;
    }
    .btn:hover { background: #f0f0ee; }
    #loader { display: none; font-size: 14px; color: #888; margin-top: 10px; }
    #errorMsg { color: #c0392b; font-size: 14px; margin-top: 8px; }

    /* PDF collapsible */
    #pdfSection { display: none; margin: 1rem; margin-bottom: 1.5rem; width: 45%;}
    .collapsible-header {
      display: flex; align-items: center; justify-content: space-between;
      background: #fff; border: 0.5px solid #ddd; border-radius: 12px;
      padding: 0.85rem 1.25rem; cursor: pointer; user-select: none;
    }
    .collapsible-header:hover { background: #f9f9f7; }
    .collapsible-header span { font-size: 14px; font-weight: 500; }
    .collapsible-header .file-name { font-size: 13px; color: #888; margin-left: 8px; font-weight: 400; }
    .chevron {
      width: 16px; height: 16px; transition: transform 0.25s ease;
      color: #888;
    }
    .chevron.open { transform: rotate(180deg); }
    .collapsible-body {
      overflow: hidden; max-height: 0;
      transition: max-height 0.35s ease, padding 0.25s ease;
      background: #fff; border: 0.5px solid #ddd;
      border-top: none; border-radius: 0 0 12px 12px;
    }
    .collapsible-body.open { max-height: 800px; padding: 0; }
    #pdfViewer {
      width: 100%; height: 600px;
      border: none; border-radius: 0 0 12px 12px; display: block;
    }

    /* Results */
    #results { display: none; }
    .section-title { font-size: 16px; font-weight: 500; margin: 1.5rem 0 0.75rem; }
    .metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 1rem; }
    .metric-card { background: #f1efe8; border-radius: 8px; padding: 1rem; }
    .metric-label { font-size: 12px; color: #888; margin-bottom: 4px; }
    .metric-value { font-size: 28px; font-weight: 500; }
    .score-fill { height: 6px; border-radius: 3px; background: #ddd; margin-top: 8px; }
    .score-bar { height: 100%; border-radius: 3px; transition: width 0.6s ease; }
    .card-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .card, .wide-card {
      background: #fff; border: 0.5px solid #ddd;
      border-radius: 12px; padding: 1rem 1.25rem;
    }
    .card h3 {
      font-size: 12px; font-weight: 500; color: #888;
      text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 10px;
    }
    .tag-list { display: flex; flex-wrap: wrap; gap: 6px; }
    .tag { font-size: 12px; padding: 3px 10px; border-radius: 999px; }
    .tag-red { background: #FCEBEB; color: #A32D2D; }
    .tag-blue { background: #E6F1FB; color: #185FA5; }
    ul.plain { list-style: none; padding: 0; }
    ul.plain li {
      font-size: 14px; padding: 6px 0;
      border-bottom: 0.5px solid #eee; line-height: 1.5;
    }
    ul.plain li:last-child { border-bottom: none; }
    .resource-block { margin-bottom: 12px; }
    .resource-block .skill-name { font-size: 13px; font-weight: 500; margin-bottom: 4px; }
    .resource-block .resource-item {
      font-size: 13px; color: #555; padding: 2px 0 2px 12px;
      border-left: 2px solid #ddd;
    }
  </style>
</head>
<body>
<div class="page">
  <h1>Resume analyzer</h1>
    <div class="topSection">
        <div class="form-card" id="formSection">
            <form id="jobForm" enctype="multipart/form-data">
            <div class="field">
                <label>Upload CV (PDF)</label>
                <input type="file" name="cvFile" id="cvFile" accept="application/pdf" required />
            </div>
            <div class="field">
                <label>Job role</label>
                <input type="text" name="JOB_ROLE" required placeholder="e.g. Frontend Developer" />
            </div>
            <div class="field">
                <label>Job description</label>
                <textarea name="JOB_DESCRIPTION" rows="3" required placeholder="Paste the job description..."></textarea>
            </div>
            <div class="field">
                <label>Job responsibilities</label>
                <textarea name="JOB_RESPONSIBILITIES" rows="3" required></textarea>
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
                <div class="field">
                <label>Deadline</label>
                <input type="date" name="DEADLINE" />
                </div>
                <div class="field">
                <label>Experience wanted</label>
                <input type="text" name="EXPERIENCE_WANTED" placeholder="e.g. 2+ years" />
                </div>
            </div>
            <div class="field">
                <label>Required skills</label>
                <input type="text" name="REQUIRED_SKILLS" placeholder="e.g. React, Node.js" />
            </div>
            <div class="field">
                <label>Special notes</label>
                <textarea name="SPECIAL_NOTES" rows="2"></textarea>
            </div>
            <button type="submit" class="btn">Analyze resume</button>
            </form>
            <p id="loader">Analyzing your resume — this may take a moment...</p>
            <p id="errorMsg"></p>
        </div>

        <!-- Collapsible PDF preview -->
        <div id="pdfSection">
            <div class="collapsible-header" id="pdfToggle">
            <div>
                <span>Uploaded CV</span>
                <span class="file-name" id="pdfFileName"></span>
            </div>
            <svg class="chevron" id="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
            </div>
            <div class="collapsible-body" id="pdfBody">
            <iframe id="pdfViewer" title="CV preview"></iframe>
            </div>
        </div>
    </div>

  <!-- Results -->
  <div id="results">
    <div class="metrics">
      <div class="metric-card">
        <div class="metric-label">ATS score</div>
        <div class="metric-value" id="atsScore">—</div>
        <div class="score-fill"><div class="score-bar" id="atsBar" style="background:#639922;width:0%"></div></div>
      </div>
      <div class="metric-card">
        <div class="metric-label">Job match</div>
        <div class="metric-value" id="matchScore">—</div>
        <div class="score-fill"><div class="score-bar" id="matchBar" style="background:#185FA5;width:0%"></div></div>
      </div>
    </div>

    <div class="card-grid">
      <div class="card">
        <h3>Strengths</h3>
        <ul class="plain" id="strengthsList"></ul>
      </div>
      <div class="card">
        <h3>Gaps</h3>
        <ul class="plain" id="gapsList"></ul>
      </div>
    </div>

    <p class="section-title">CV improvements</p>
    <div class="wide-card"><ul class="plain" id="upgradeList"></ul></div>

    <p class="section-title">Missing keywords</p>
    <div class="tag-list" id="keywordTags"></div>

    <p class="section-title">Skills to learn</p>
    <div class="tag-list" id="skillTags"></div>

    <p class="section-title">Learning resources</p>
    <div class="wide-card" id="resourcesBlock"></div>

    <p class="section-title">Suggestions</p>
    <div class="wide-card"><ul class="plain" id="suggestionsList"></ul></div>

    <div style="margin-top:1.5rem;">
      <button class="btn" onclick="resetPage()">Analyze another</button>
    </div>
  </div>
</div>

<script>
  let currentObjectURL = null;

  // Show PDF preview as soon as a file is picked
  document.getElementById('cvFile').addEventListener('change', function () {
    const file = this.files[0];
    if (!file) return;

    // Revoke old URL to free memory
    if (currentObjectURL) URL.revokeObjectURL(currentObjectURL);
    currentObjectURL = URL.createObjectURL(file);

    document.getElementById('pdfViewer').src = currentObjectURL;
    document.getElementById('pdfFileName').textContent = file.name;
    document.getElementById('pdfSection').style.display = 'block';

    // Auto-open on first load
    openCollapsible();
  });

  // Toggle collapse
  document.getElementById('pdfToggle').addEventListener('click', function () {
    const body = document.getElementById('pdfBody');
    const chevron = document.getElementById('chevron');
    const isOpen = body.classList.contains('open');
    if (isOpen) {
      body.classList.remove('open');
      chevron.classList.remove('open');
    } else {
      openCollapsible();
    }
  });

  function openCollapsible() {
    document.getElementById('pdfBody').classList.add('open');
    document.getElementById('chevron').classList.add('open');
  }

  function renderList(id, items) {
    document.getElementById(id).innerHTML = (items || []).map(i => `<li>${i}</li>`).join('');
  }
  function renderTags(id, items, cls) {
    document.getElementById(id).innerHTML = (items || []).map(i => `<span class="tag ${cls}">${i}</span>`).join('');
  }
  function renderBar(id, val) {
    setTimeout(() => { document.getElementById(id).style.width = Math.min(val, 100) + '%'; }, 100);
  }
  function renderResources(data) {
    document.getElementById('resourcesBlock').innerHTML = (data || []).map(r => `
      <div class="resource-block">
        <div class="skill-name">${r.skill}</div>
        ${(r.resources || []).map(res => `<div class="resource-item">${res}</div>`).join('')}
      </div>`).join('');
  }
  function showResults(d) {
    document.getElementById('atsScore').textContent = d.ats_score + '/100';
    document.getElementById('matchScore').textContent = d.job_match_percentage + '%';
    renderBar('atsBar', d.ats_score);
    renderBar('matchBar', d.job_match_percentage);
    renderList('strengthsList', d.strengths);
    renderList('gapsList', d.gaps);
    renderList('upgradeList', d.places_to_upgrade_in_cv);
    renderTags('keywordTags', d.missing_keywords, 'tag-red');
    renderTags('skillTags', d.skills_to_learn, 'tag-blue');
    renderResources(d.learning_resources);
    renderList('suggestionsList', d.suggestions);
    document.getElementById('formSection').style.display = 'none';
    document.getElementById('results').style.display = 'block';
  }
  function resetPage() {
    document.getElementById('results').style.display = 'none';
    document.getElementById('formSection').style.display = 'block';
    document.getElementById('jobForm').reset();
    document.getElementById('pdfSection').style.display = 'none';
    document.getElementById('pdfBody').classList.remove('open');
    document.getElementById('chevron').classList.remove('open');
    if (currentObjectURL) { URL.revokeObjectURL(currentObjectURL); currentObjectURL = null; }
  }

  document.getElementById('jobForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const loader = document.getElementById('loader');
    const errMsg = document.getElementById('errorMsg');
    loader.style.display = 'block';
    errMsg.textContent = '';
    try {
      const res = await fetch('/analyze', { method: 'POST', body: new FormData(e.target) });
      const json = await res.json();
      if (json.success) {
        showResults(json.reply);
      } else {
        errMsg.textContent = json.message || 'Something wrong.';
      }
    } catch (err) {
      errMsg.textContent = 'Error: ' + err.message;
    } finally {
      loader.style.display = 'none';
    }
  });
</script>
</body>
</html>
